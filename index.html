<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Running of the Frenchie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Figtree:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#8CCBEA; --ink:#2B1B12; --red:#D7263D; --ochre:#E39B2E;
  --panel:rgba(255,255,255,.9); --panel-ink:#2B1B12; --muted:#6E5A4A; --track:#E9DCC9;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky:#14232F; --ink:#F3E6D6; --panel:rgba(24,20,18,.88); --panel-ink:#F3E6D6; --muted:#B9A693; --track:#4A3D33;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky:#14232F; --ink:#F3E6D6; --panel:rgba(24,20,18,.88); --panel-ink:#F3E6D6; --muted:#B9A693; --track:#4A3D33;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*,*::before,*::after{box-sizing:inherit}
body{background:var(--sky);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#game{position:relative;height:100%;max-width:560px;margin:0 auto;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

#hud{position:absolute;left:10px;right:10px;top:10px;background:var(--panel);color:var(--panel-ink);border-radius:14px;padding:10px 12px 9px;box-shadow:0 2px 0 rgba(43,27,18,.25);pointer-events:none;opacity:0;transition:opacity .2s}
#hud.on{opacity:1}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:7px}
#street{font-family:"Alfa Slab One",Georgia,serif;font-size:15px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#meters{font-weight:800;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);white-space:nowrap}
.track{position:relative;height:6px;border-radius:3px;background:var(--track);margin:0 12px 10px 4px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--ochre);width:0}
#dogmark{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:16px;left:0}
.ring{position:absolute;right:-14px;top:50%;transform:translateY(-50%);font-size:16px}
.row{display:flex;align-items:center;gap:10px}
.meter{flex:1;display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.bar{flex:1;height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:#3B9AD9;transition:background .2s}
.bar i.low{background:var(--red)}
#boops{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}

#charge{position:absolute;right:16px;bottom:18px;width:96px;height:96px;border-radius:50%;border:4px solid #fff;background:var(--red);color:#fff;font-family:"Alfa Slab One",Georgia,serif;font-size:17px;letter-spacing:.02em;box-shadow:0 5px 0 #8E1424;touch-action:none;display:none;cursor:pointer}
#charge.on{display:block}
#charge.held{transform:translateY(4px);box-shadow:0 1px 0 #8E1424}
#charge:focus-visible,#ov button:focus-visible{outline:3px solid var(--ochre);outline-offset:3px}
#snd{position:absolute;left:14px;bottom:20px;width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:rgba(43,27,18,.55);font-size:20px;line-height:1;cursor:pointer;touch-action:manipulation;z-index:5}
#snd:focus-visible{outline:3px solid var(--ochre);outline-offset:3px}
#hint{position:absolute;left:72px;bottom:22px;max-width:52%;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);pointer-events:none;display:none}
#hint.on{display:block}

#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(43,27,18,.35)}
#ov.show{display:flex}
.card{background:var(--panel);color:var(--panel-ink);border-radius:20px;padding:24px 22px 20px;max-width:380px;width:100%;box-shadow:0 6px 0 rgba(43,27,18,.3)}
.portrait{display:block;width:96px;height:96px;border-radius:50%;object-fit:cover;border:4px solid var(--red);margin:0 0 12px}
.card h1{font-family:"Alfa Slab One",Georgia,serif;font-weight:400;font-size:clamp(30px,9vw,40px);line-height:1;margin:0 0 12px;color:var(--red)}
.card p{margin:0 0 14px;font-size:16px;line-height:1.45}
.rules{margin:0 0 18px;padding:0;list-style:none;font-size:14.5px;line-height:1.4;color:var(--muted)}
.rules li{padding-left:28px;position:relative;margin-bottom:6px}
.rules li span{position:absolute;left:0;top:0}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:0 0 16px;text-align:center}
.stats div{background:var(--track);border-radius:12px;padding:8px 4px}
.stats b{display:block;font-family:"Alfa Slab One",Georgia,serif;font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.stats small{font-size:12px;font-weight:700;color:var(--muted)}
.title{font-weight:800;font-size:15px;margin:0 0 16px}
#ov button{width:100%;border:0;border-radius:14px;padding:14px;background:var(--red);color:#fff;font-family:"Alfa Slab One",Georgia,serif;font-size:19px;cursor:pointer;box-shadow:0 4px 0 #8E1424}
#ov button.ghost{background:transparent;color:var(--panel-ink);box-shadow:inset 0 0 0 2px var(--track);margin-top:10px;font-size:16px}
.part{font-weight:800;font-size:13px;color:var(--muted);margin:0 0 6px}
.done{font-size:14px!important;color:var(--muted);margin:0 0 12px!important}
.news{font-size:14.5px!important;background:var(--track);border-radius:12px;padding:10px 12px}
#ov button:active{transform:translateY(3px);box-shadow:0 1px 0 #8E1424}
</style>
</head>
<body>
<div id="game">
  <canvas id="c" aria-label="Pamplona street with a French bulldog chasing runners"></canvas>
  <div id="hud" aria-live="off">
    <div class="top"><div id="street">Calle Santo Domingo</div><div id="meters">0 / 260 m</div></div>
    <div class="track"><i id="prog"></i><span id="dogmark">🐶</span><span class="ring" id="endmark">🚩</span></div>
    <div class="row">
      <div class="meter">Breath<div class="bar"><i id="stam"></i></div></div>
      <div id="boops">0 boops</div>
    </div>
  </div>
  <div id="hint">← → or A / D to steer<br>Hold space to charge</div>
  <button id="charge" aria-label="Charge (hold)">Charge</button>
  <div id="ov" class="show"><div class="card" id="card"></div></div>
  <button id="snd" aria-label="Mute sound">🔊</button>
</div>

<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const hud = $('hud'), ov = $('ov'), card = $('card'), chargeBtn = $('charge'), hint = $('hint');
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const finePointer = window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches;

const BASE = 9, CHARGE = 15, ZOOM = 18, SEG = 12;
const FAC = ['#E39B2E','#F7F2EA','#C8553D','#F2C14E','#9DB4C0','#E7D3B0','#7FA88A'];
const SKIN = ['#F1C9A5','#D9A47C','#B97A55','#8D5A3B','#F6D7BE'];
const HAIR = ['#2B1B12','#5A3A22','#111111','#B5874A','#8A8A8A','#3B2A1E'];
const CROWD = ['#F7F2EA','#D7263D','#F2C14E','#2F6DB5','#F7F2EA','#E39B2E','#F7F2EA'];
const PASTEL = ['#7FA88A','#2F6DB5','#C8553D','#E39B2E','#8E6BA8','#3B5B7A','#D6337A'];
const BOOP = ['boop!','¡ay!','boop!','¡olé!','snort!','boop!','¡madre mía!'];
const MOVERS = {
  waiter:  { body:'#1E1E22', shirt:'#FFFFFF', legs:'#1E1E22', item:'tray', lines:['¡cuidado!','my tray!','¡no, no, no!'] },
  baker:   { body:'#F7F2EA', shirt:'#E8E2D6', legs:'#E8E2D6', item:'churros', hat:1, lines:['¡mis churros!','¡fuera!','flour everywhere!'] },
  cook:    { body:'#F7F2EA', shirt:'#E8E2D6', legs:'#2B2B30', item:'pan', hat:1, lines:['¡quema!','my tortilla!','¡chef!'] },
  guest:   { body:null, shirt:'#F7F2EA', legs:'#2B2B30', item:'plate', lines:['¡ay, Chorizo!','my croquetas!','who invited the dog?'] },
  musician:{ body:'#F7F2EA', shirt:'#D7263D', legs:'#F7F2EA', item:'trumpet', lines:['♪ bwaaap ♪','¡olé!','off-key!'] },
  clerk:   { body:'#2F6DB5', shirt:'#F7F2EA', legs:'#2B2B30', item:'papers', chair:1, speed:1.3, lines:['my spreadsheet!','¡oiga!','that was filed!'] },
  bellhop: { body:'#A61E2E', shirt:'#F2C14E', legs:'#1E1E22', item:'trolley', lines:['¡las maletas!','sir, please!','that’s room 12’s!'] },
  pastor:  { body:'#2E5E3A', shirt:'#F7F2EA', legs:'#3A2A20', item:'stick', hr:1.35, lines:['¡eh, eh, eh!','¡vamos, toro!','shoo!'] },
  delivery:{ body:'#3B5B7A', shirt:'#F2C14E', legs:'#2B2B30', item:'handtruck', hr:1.15, lines:['¡mis naranjas!','that was signed for!','¡oye!'] },
  kid:     { body:null, shirt:'#F7F2EA', legs:'#3B5B7A', item:'none', scale:.72, speed:1.5, hr:.8, lines:['¡perrito!','DOGGY!','¡mamá, mira!'] },
  dancer:  { body:'#D7263D', shirt:'#F7F2EA', legs:'#1E1E22', item:'castanets', skirt:1, hr:1.25, lines:['¡jota!','¡ole tú!','*twirl*'] },
  pyjama:  { body:'#8EB6D9', shirt:'#BFD7EA', legs:'#8EB6D9', item:'mug', speed:.6, lines:['¿qué hora es?','my coffee!','it’s eight in the morning!'] },
  camera:  { body:'#2B2B30', shirt:'#4A4A52', legs:'#2B2B30', item:'camera', speed:.7, hr:1.1, lines:['we’re live!','¡en directo!','did you get that?'] },
  tourist: { body:null, shirt:'#F7F2EA', legs:'#C9A27E', item:'selfie', hr:1.1, lines:['selfie!','so authentic!','omg a doggo'] }
};
const ROUNDS = { basket:.85, pot:.75, sack:.85, drum:1.05, suitcase:.8, coatrack:.75, lamp:.65, cooler:.7, crate:.85, dogbed:.95 };
const ROLLERS = { barrel:{ r:1.0, v:[3.5,5.5] }, yarn:{ r:.55, v:[3,5] }, chair:{ r:.85, v:[2.5,4] } };
const SLIPPY = { banana:1, tomato:1, jug:1 };
const FURN = { sofa:1.5, dtable:1.7, desk:1.4, counter:1.3, bed:2.4, stove:1.4, case:1.3, washer:1.5, booth:1.7, shoerack:1.0 };
const LEVELS = [
  { name:'The gates', place:'Calle Santo Domingo', env:'street', len:220,
    mix:[['run',50],['bar',22],['mover:pastor',16],['bowl',9],['churro',3]],
    story:'The rocket goes up at eight o’clock sharp. The corral gate swings open and Chorizo trots out onto Calle Santo Domingo, which is uphill, which is rude. Hundreds of runners in white were expecting a bull. They got a bulldog. Some of them laughed. Chorizo is keeping track of who.',
    news:'Runners: boop them. Fences: go around them. Pastores with long sticks try to steer you.' },
  { name:'Uphill', place:'Calle Santo Domingo', env:'street', len:220,
    mix:[['run',40],['roller:barrel',24],['bar',18],['bowl',13],['churro',5]],
    story:'Santo Domingo keeps going up. Chorizo’s legs keep being short. The fences get closer together, as if the city planned this personally. At the top, a wine shop has just lost control of its barrels.',
    news:'Wine barrels roll down the hill straight at you. Fences too.' },
  { name:'The open door', place:'Casa de Itziar', env:'house', floor:'tile', wall:'#E8D9C0', len:180,
    mix:[['round:coatrack',22],['furn:shoerack',20],['run',20],['bowl',22],['churro',6]],
    story:'Halfway up the hill a front door is standing open, and from inside comes the smell of frying chorizo. Chorizo has never been so sure of anything. He turns left, straight into Señora Itziar’s hallway. Several runners, confused, follow him in.',
    news:'Coat stands and shoe racks fill the hallway. Every room has a wall with one doorway. Find it.' },
  { name:'The kitchen', place:'Cocina de Itziar', env:'house', floor:'check', wall:'#CFE3D6', len:190, trash:{ kinds:['tomato'], drop:1, every:[.6, 1.1] },
    mix:[['furn:stove',20],['cat',16],['wet',14],['bowl',20],['run',6],['churro',6]],
    story:'The kitchen. The chorizo is on the stove, out of reach, which is a tragedy. The floor has just been mopped, which is another one. And Itziar’s three cats have opinions about dogs. Then the crate of tomatoes on top of the fridge starts to tip.',
    news:'Tomatoes fall from the top shelves: watch for the shadows and don’t step in the splats. Hot stoves, cats and mop water too.' },
  { name:'The courtyard', place:'Patio de Itziar', env:'house', floor:'stone', wall:'#B9C9A7', len:200, rooms:[20,28], trash:1,
    mix:[['round:pot',30],['round:basket',18],['bowl',22],['churro',6],['run',6]],
    story:'Out the back door into a courtyard full of geraniums and drying laundry. Itziar is shouting something in Basque. So are the neighbours, who have chosen this exact moment to clear out their kitchens through the windows. Chorizo takes all of it as encouragement. There’s a gate at the far end and, beyond it, the town hall square.',
    news:'Neighbours are throwing rubbish out of the windows. Watch for the shadow and get out of the way. Banana peels and tomatoes stay slippery.' },
  { name:'Lunch rush', place:'Plaza Consistorial', env:'street', len:210,
    mix:[['run',40],['table',26],['mover:waiter',18],['bowl',12],['churro',4]],
    story:'Through the gate and back into the run. The cafés on the square have already put their tables out. It is 8:02 in the morning. Waiters are crossing with full trays, because nobody told them either.',
    news:'Café tables stick out from the walls. Waiters cross with trays.' },
  { name:'Mercaderes', place:'Calle Mercaderes', env:'street', len:220,
    mix:[['run',32],['round:crate',24],['mover:delivery',20],['bar',8],['bowl',12],['churro',4]],
    story:'Mercaderes is even busier. Somebody has ordered paella for breakfast. Chorizo respects that. He also smells sugar, very close, coming from a doorway on the left.',
    news:'Fruit crates outside the shops burst when you get close and send fruit flying. Watch the shadows. Delivery men push hand trucks.' },
  { name:'The bakery', place:'Pastelería Ibáñez', env:'house', floor:'tile', wall:'#F3D9E0', len:190,
    mix:[['round:sack',20],['mover:baker',22],['furn:case',16],['churro',18],['bowl',16],['run',6]],
    story:'The doorway on the left is a bakery, and the bakery is frying churros. Chorizo goes in. The bakers did not plan for this. Behind the counter there is another counter, and behind that, another.',
    news:'Bakers with trays, flour sacks and glass pastry cases. Churros everywhere.' },
  { name:'Upstairs', place:'Piso de arriba', env:'house', floor:'wood', wall:'#DCE4F0', len:200,
    mix:[['furn:sofa',22],['roomba',20],['round:lamp',16],['bowl',20],['churro',6],['run',6]],
    story:'Up the back stairs, which Chorizo takes one at a time, with dignity. At the top is someone’s apartment. Someone’s very nice apartment, with a lot of sofas in odd places.',
    news:'Sofas, floor lamps, and a robot vacuum that takes its job very seriously.' },
  { name:'Family lunch', place:'Casa Etxeberria', env:'house', floor:'wood', wall:'#F0E1C8', len:210,
    mix:[['furn:dtable',24],['mover:guest',20],['mover:kid',18],['bowl',16],['churro',8]],
    story:'The apartment belongs to the Etxeberria family, and all thirty-one of them are home for the fiesta. They are carrying plates between rooms. Grandfather Etxeberria raises a glass as Chorizo goes by.',
    news:'Long dining tables, relatives with plates, and small cousins who want to pet you.' },
  { name:'The parade', place:'Calle Estafeta', env:'street', road:.92, len:240,
    mix:[['run',32],['cab',22],['giant',12],['bar',6],['bowl',14],['churro',4]],
    story:'Down a fire escape and out onto Calle Estafeta: long, straight and narrow. Coming the other way, for reasons the city council will spend months investigating, is the parade of gigantes and cabezudos: giants four metres tall and big-headed figures that sway.',
    news:'Cabezudos sway across the street, and the gigantes are enormous.' },
  { name:'Sangría', trash:{ kinds:['jug'], every:[.9, 1.6] }, place:'Calle Estafeta', env:'street', road:.92, len:240,
    mix:[['run',34],['puddle',18],['cab',12],['bar',8],['bowl',14],['churro',4]],
    story:'Someone on a balcony drops a full jug of sangría. Then, out of solidarity, so does everyone else.',
    news:'Sangría jugs fly off the balconies. Dodge the shadows. The puddles make you slide.' },
  { name:'The peña', place:'Peña La Jarana', env:'house', floor:'tile', wall:'#E2B9B0', len:200,
    mix:[['mover:musician',22],['round:drum',18],['mover:dancer',18],['bowl',20],['churro',8],['run',6]],
    story:'To dodge a cabezudo, Chorizo ducks through the door of a peña, one of the town’s social clubs, where a brass band is rehearsing at full volume. The band does not stop. The band speeds up.',
    news:'Brass players, bass drums and jota dancers spinning across the floor.' },
  { name:'Laundry day', place:'Lavandería', env:'house', floor:'check', wall:'#E0EEF2', len:200,
    mix:[['furn:washer',20],['round:basket',18],['suds',20],['cat',8],['bowl',20],['churro',6]],
    story:'Out the peña’s back door and straight into a laundromat, where every red pañuelo in Pamplona is being washed at once. The floor is soaked. A cat lives here. Of course a cat lives here.',
    news:'Rows of washing machines, laundry baskets and soap suds that make you slide. Plus the cat.' },
  { name:'The balcony', trash:{ kinds:['flowerpot','flowerpot','flowerpot','tomato'], every:[.8, 1.4] }, place:'Calle Estafeta', env:'street', road:.9, len:250,
    mix:[['run',36],['bar',18],['cab',8],['bowl',14],['churro',4]],
    story:'Back on Estafeta, a voice from a balcony: “¡Chorizo!” It’s Abuela Pilar, holding a churro and pointing at the bullring. Then she points at her own front door, which is open, which is a shortcut.',
    news:'Everyone on Estafeta is leaning over their railings to look, and the geranium pots are coming down.' },
  { name:'Home', place:'Casa de Abuela Pilar', env:'house', floor:'tile', wall:'#F5DDA0', len:200, catName:'Membrillo',
    mix:[['cat',22],['roller:yarn',18],['furn:sofa',14],['round:dogbed',12],['bowl',24],['churro',10]],
    story:'Chorizo knows this house. His bed is by the window. His bowl is in the kitchen. Membrillo the cat is in the hallway, as always, and has never once in his life moved out of the way.',
    news:'Membrillo the cat, balls of yarn rolling out of Abuela’s knitting basket, and full bowls, because it’s your house.' },
  { name:'The neighbours', place:'Pisos de Estafeta', env:'house', floor:'wood', wall:'#E4D4EC', len:210, rooms:[12,18],
    mix:[['furn:bed',22],['mover:pyjama',20],['round:lamp',10],['bowl',20],['run',8],['churro',6]],
    story:'Abuela’s back door opens onto the shared landing, and the landing opens into everyone’s flat. Chorizo meets all the neighbours in about nine seconds. Most of them are still in bed.',
    news:'Big beds, and sleepy neighbours in pyjamas wandering out with their coffee.' },
  { name:'Telefónica', place:'Tramo Telefónica', env:'street', road:.75, len:220,
    mix:[['run',34],['pile',20],['furn:booth',18],['bowl',18],['churro',6],['bar',4]],
    story:'Down the neighbours’ stairs and out at the bend by the old telephone building. The runners ahead have started falling over each other in heaps.',
    news:'Piles of fallen runners and old phone booths.' },
  { name:'The phone company', place:'Edificio Telefónica', env:'house', floor:'office', wall:'#D5D8DC', len:210,
    mix:[['furn:desk',22],['mover:clerk',18],['roller:chair',18],['round:cooler',12],['bowl',18],['churro',6]],
    story:'A heap of runners blocks the whole street, so Chorizo goes around through the telephone building. It is a public holiday. Somebody is still working. Several somebodies, on rolling chairs.',
    news:'Desks, clerks on rolling chairs, runaway rolling chairs, and water coolers.' },
  { name:'El Callejón', place:'El Callejón', env:'street', road:.62, len:220,
    mix:[['run',32],['pile',26],['mover:camera',18],['bowl',18],['churro',6]],
    story:'Out a fire door and into the callejón, the narrow last stretch before the bullring. Wooden walls on both sides. Bodies everywhere. Chorizo has never been more focused.',
    news:'Narrow street, big piles, and TV camera crews trying to get the shot.' },
  { name:'The hotel', place:'Hotel El Toril', env:'house', floor:'check', wall:'#CDB98E', len:210,
    mix:[['round:suitcase',20],['mover:bellhop',20],['mover:tourist',20],['furn:sofa',8],['bowl',18],['churro',8]],
    story:'A gap in the callejón fence leads to the service door of a hotel, and the service door leads to the lobby, where an entire tour group has just arrived with all its luggage.',
    news:'Bellhops with luggage trolleys, suitcases, and tourists with selfie sticks.' },
  { name:'The hotel kitchen', trash:{ kinds:['plate'], drop:1, every:[.7, 1.2] }, place:'Cocina del hotel', env:'house', floor:'check', wall:'#DDE6E1', len:210,
    mix:[['mover:cook',22],['furn:stove',18],['wet',14],['bowl',22],['churro',8]],
    story:'Through a swinging door into the hotel kitchen at the exact moment breakfast service peaks. The head chef sees Chorizo, sees the floor, and makes a decision about the floor.',
    news:'Cooks with hot pans, stoves, wet tiles, and stacks of plates crashing down.' },
  { name:'The tunnel', dark:1, place:'Túnel del toril', env:'street', road:.58, len:220,
    mix:[['pile',26],['run',36],['bar',14],['bowl',18],['churro',6]],
    story:'Out the loading bay and into the last tunnel. Ahead there is light and noise. A lot of noise. Twenty thousand people’s worth.',
    news:'It’s dark in here. You can only see what’s close.' },

function makeCobble(){

function update(dt){

      case 'cat': {
        if (!e.hit){
          if (L.smart){ const ah = e.wy - st.dist; if (ah > 3 && ah < 9 && Math.abs(st.px - e.x) > .04) e.vx = Math.sign(st.px - e.x)*Math.abs(e.vx); }
          e.x += e.vx*dt; e.ph += dt*10;
          if (e.x < .05){ e.x = .05; e.vx = Math.abs(e.vx); }
          if (e.x > .95){ e.x = .95; e.vx = -Math.abs(e.vx); }
          if (hitC(e, dogR*.55)){ bonk(e, L.catName ? pick([`¡${L.catName}!`,'hsss!']) : pick(['hsss!','mrrrow!','¡gato!']), 14); e.vx *= 2.5; e.hit = 1; }
        } else { e.x += e.vx*dt; e.ph += dt*14; }
        break;
      }
      case 'puddle': {
        if (e.hit) break;
        const rx = e.rx*roadW, ry = rx*.55;
        const qx = (dx - sx(e.x))/rx, qy = (dy - sy(e.wy))/ry;
        if (qx*qx + qy*qy < 1){ e.hit = 1; st.slip = 1.8; sfx('slip'); st.drift = (Math.random() < .5 ? -1 : 1)*rnd(.25,.45); pop(e.foam ? 'bubbles!' : 'wheee', e.x, e.wy, e.wet || e.foam ? '#BFE6FF' : '#FFB3C1'); }
        break;
      }
      case 'cab': {
        e.wy += (e.giant ? .9 : 1.4)*dt; e.ph += dt*L.diff*(e.giant ? .6 : 1);
        if (L.smart && e.wy > st.dist && e.wy - st.dist < 14) e.x0 += clamp(st.px - e.x0, -.07*dt, .07*dt);
        e.x = clamp(e.x0 + Math.sin(e.ph*1.5)*e.amp, .1, .9);
        if (!e.hit && hitC(e, dogR*(e.giant ? 1.9 : 1.45))) bonk(e, pick(e.giant ? ['¡el gigante!','BONG','mind the dress!'] : ['¡ay, mi cabeza!','bonk','¡perdón!']));
        break;
      }
      case 'pile': if (!e.hit && hitBox(e, e.w*roadW/2 - dogR*.1, dogR*.9)) bonk(e, '¡montón!'); break;
      case 'round': if (e.v === 'crate' && !e.burst && e.wy - st.dist < 11 && e.wy - st.dist > 0) burstCrate(e);
        if (!e.hit && hitC(e, dogR*ROUNDS[e.v]*.9)) bonk(e, { basket:'my laundry!', pot:'¡mis geranios!', sack:'poof', drum:'BOOM', suitcase:'¡mi maleta!', coatrack:'¡mi abrigo!', lamp:'flicker', cooler:'glug glug', crate:'¡naranjas!', dogbed:'so comfy… no!' }[e.v]); break;
      case 'roller': {
        e.wy += e.vy*dt; e.x += e.vx*dt; e.rot += -e.vy*dt*1.6;
        if (L.smart && e.wy > st.dist) e.x += clamp(st.px - e.x, -.12*dt, .12*dt);
        if (e.x < .08 || e.x > .92) e.vx = -e.vx;
        if (!e.hit && hitC(e, dogR*ROLLERS[e.v].r*.9)) bonk(e, { barrel:'¡el vino!', yarn:'¡mi lana!', chair:'clunk' }[e.v]);
        break;
      }
      case 'roomba': {
        e.x += e.vx*dt; e.wy += e.vy*dt; e.ph += dt;
        if (L.smart){ const ah = e.wy - st.dist; if (ah > 0 && ah < 9) e.vx = Math.sign(st.px - e.x)*Math.abs(e.vx); }
        if (e.x < .07 || e.x > .93){ e.vx = -e.vx; e.x = clamp(e.x, .07, .93); }
        if (!e.hit && hitC(e, dogR*.75)){ bonk(e, pick(['beep boop','*angry beeping*','¡limpiando!']), 12); }
        break;
      }
      case 'furn': if (!e.hit && hitBox(e, e.w*roadW/2 - dogR*.1, dogR*FURN[e.v]/2 - 2)) bonk(e, { sofa:'oof', dtable:'¡la vajilla!', desk:'my coffee!', counter:'clang', bed:'¿qué pasa?', stove:'¡quema!', case:'¡los pasteles!', washer:'spin cycle!', booth:'ring ring', shoerack:'¡mis zapatos!' }[e.v]); break;
      case 'cape': {
        e.ph += dt;
        const ahead = e.wy - st.dist;
        if (!e.hit && ahead < 20 && ahead > 0) e.x += clamp(st.px - e.x, -.42*L.diff*dt, .42*L.diff*dt);
        if (!e.hit && hitC(e, dogR*1.1)){ bonk(e, '¡olé!', 10); st.spin = .7; }
        break;
      }
      case 'trash': {
        e.t += dt;
        const slippy = !!SLIPPY[e.kind];
        if (!e.landed && e.t >= e.T){
          e.landed = 1;
          if (hitC(e, dogR*.55)){ bonk(e, pick({ tomato:['¡tomate!','splat'], jug:['¡sangría!','splash'], flowerpot:['¡mis geranios!','bonk'], plate:['CRASH','¡los platos!'], cushion:['flump','¡olé!'], hat:['nice hat','¡sombrero!'], flower:['¡una flor!','aww'], orange:['¡naranja!','bonk'], apple:['¡manzana!','bonk'] }[e.kind] || ['¡basura!','eww','splat','¡oye, arriba!']), e.small ? 8 : 14); e.used = 1; } else sfx(SLIPPY[e.kind] ? 'splat' : e.kind === 'plate' ? 'crash' : 'flump', .35);
        } else if (e.landed){
          if (slippy && !e.used && hitC(e, dogR*.35)){ e.used = 1; st.slip = 1.6; sfx('slip'); st.drift = (Math.random() < .5 ? -1 : 1)*rnd(.3,.5); pop(e.kind === 'banana' ? 'whoops' : e.kind === 'jug' ? 'slosh' : 'squelch', e.x, e.wy, '#FFD34D'); }
          if (!slippy){ e.fade -= dt; if (e.fade <= 0) e.gone = 1; }
        }
        break;
      }
      case 'matador': {
        e.ph += dt;
        const ahead = e.wy - st.dist;
        if (!e.hit && ahead < 16 && ahead > 0) e.x += clamp(st.px - e.x, -.22*L.diff*dt, .22*L.diff*dt);
        if (!e.hit && hitC(e, dogR*1.2)){ bonk(e, pick(['¡olé!','¡torero!','¡bravo!']), 10); st.spin = .7; }
        break;
      }
      case 'picador': {
        e.ph += dt; e.x += e.vx*dt;
        if (e.x < .14 || e.x > .86){ e.vx = -e.vx; e.x = clamp(e.x, .14, .86); }
        if (!e.hit && hitC(e, dogR*1.45)) bonk(e, pick(['¡el caballo!','neigh!','¡cuidado!']), 14);
        break;
      }
      case 'bander': {
        e.ph += dt*8; e.x += e.vx*dt;
        if (e.x < -.1 || e.x > 1.1) e.gone = 1;
        if (!e.hit && hitC(e, dogR*.9)){ bonk(e, '¡banderillas!', 10); st.spin = .7; }
        break;
      }
      case 'forcados': {
        const ahead = e.wy - st.dist;
        if (!e.hit && ahead < 10 && ahead > 0){ e.wy -= 2*dt; e.x += clamp(st.px - e.x, -.12*dt, .12*dt); }
        if (!e.hit && hitBox(e, e.w*roadW/2 - dogR*.1, dogR*.75)) bonk(e, pick(['¡pega!','¡aguanta!','oof']), 14);
        break;
      }
      case 'bowl': if (!e.gone && hitC(e, 12)){ e.gone = 1; st.stam = Math.min(100, st.stam + 22); pop('slurp', e.x, e.wy, '#BFE6FF'); sfx('slurp'); } break;
      case 'churro': if (!e.gone && hitC(e, 12)){ e.gone = 1; st.zoom = 3; pop('zoomies!', e.x, e.wy, '#FFD34D'); sfx('zoom'); } break;
    }
  }
  st.ents = st.ents.filter(e => !e.gone && sy(e.wy) < H + 120 && e.wy < st.dist + 130);
  for (const p of st.pops) p.life -= dt*1.1;
  st.pops = st.pops.filter(p => p.life > 0);

  if (st.stam <= 0) siesta();
  else if (st.dist >= L.len + (st.lv === LEVELS.length - 1 ? -1.5 : 4)) levelDone();
}

function drawSides(){
  const lo = st.dist - (H-PY)/ppm - SEG, hi = st.dist + PY/ppm + SEG;
  for (let i = Math.floor(lo/SEG); i <= Math.ceil(hi/SEG); i++){
    const y0 = sy((i+1)*SEG), y1 = sy(i*SEG), hgt = y1 - y0;
    for (const s of [0,1]){
      const x0 = s ? roadR : 0, w = s ? W - roadR : roadL;
      ctx.fillStyle = FAC[(hsh(i + st.lv*97, s+1)*FAC.length)|0];
      ctx.fillRect(x0, y0, w, hgt + 1);
      for (let b = 0; b < 2; b++){
        const by = y0 + hgt*(.25 + b*.5), bh = hgt*.3;
        const bw = Math.min(w*.62, 30), bx = s ? x0 : x0 + w - bw;
        ctx.fillStyle = 'rgba(43,27,18,.22)'; ctx.fillRect(bx, by - bh/2, bw, bh);
        const nh = 1 + ((hsh(i*7+b, s)*3)|0), hr = Math.min(6, bh/(nh*2.4));
        for (let k = 0; k < nh; k++){
          const hx = bx + bw*(s ? .4 : .6), hy = by - bh/2 + bh*(k+.5)/nh;
          ctx.fillStyle = '#F7F2EA'; ell(hx, hy + hr*.5, hr*1.3, hr*.9);
          ctx.fillStyle = SKIN[(hsh(i*13+k, b+s)*SKIN.length)|0]; ell(hx, hy, hr, hr);
          ctx.fillStyle = '#D7263D'; ell(hx + (s ? hr*1.1 : -hr*1.1), hy + hr*.4, hr*.35, hr*.35);
        }
        ctx.strokeStyle = '#2B1B12'; ctx.lineWidth = 2;
        const rx = s ? x0 + bw - 1 : x0 + w - bw + 1;
        ctx.beginPath(); ctx.moveTo(rx, by - bh/2); ctx.lineTo(rx, by + bh/2); ctx.stroke();
        if (hsh(i*3+b, s+5) < .4){
          ctx.fillStyle = '#D7263D'; ctx.fillRect(s ? x0 + bw - 4 : x0 + w - bw, by - bh*.35, 4, bh*.7);
          ctx.fillStyle = '#fff'; ctx.fillRect(s ? x0 + bw - 4 : x0 + w - bw, by - bh*.08, 4, bh*.16);
        }
      }
      ctx.fillStyle = 'rgba(43,27,18,.3)'; ctx.fillRect(x0, y0, w, 2);
    }
  }
  ctx.fillStyle = '#7A4E2A';
  ctx.fillRect(roadL - 5, 0, 5, H); ctx.fillRect(roadR, 0, 5, H);
  ctx.fillStyle = '#4E3018';
  const step = 3*ppm, off = ((st.dist*ppm) % step + step) % step;
  for (let y = off - step; y < H + step; y += step){ ctx.fillRect(roadL - 7, y, 9, 5); ctx.fillRect(roadR - 2, y, 9, 5); }
}

function drawGround(){

  }
  let pat;

  A.cur = S; A.step = 0; A.next = t + .08;
}
function schedule(){
  if (!A.ctx || !A.cur) return;
  const S = A.cur, sd = 60/S.bpm/2;
  if (A.next < A.ctx.currentTime - .5) A.next = A.ctx.currentTime + .05;
  while (A.next < A.ctx.currentTime + .15){
    playStep(S, A.step, A.next, sd);
    A.next += sd; A.step = (A.step + 1) % (8*S.prog.length);
  }
}
function playStep(S, step, t, sd){
  const bar = Math.floor(step/8), s = step % 8, [cr, q] = S.prog[bar], root = S.key + cr, v = S.vol;
  const tri = q === 'M' ? [0,4,7] : [0,3,7];
  if (S.bassSteps.includes(s)) bassN(root - 24 + (S.alt && s >= 4 ? 7 : 0), t, sd*(S.bassLen || 1.6), .45*v);
  if (S.chordSteps.includes(s)){
    if (S.chordInst === 'brass') tri.forEach(i => brass(root - 12 + i, t, sd*.75, .045*v));
    else tri.concat([12]).forEach((i, k) => pluck(root + i - (i > 4 ? 12 : 0), t + k*.014, .07*v, .5));
  }
  if (S.kick && S.kick.includes(s)) kick(t, .6*v);
  if (S.snare && S.snare[s]) snare(t, .14*v*S.snare[s]);
  if (S.cast && S.cast[s]) cast(t, .2*v);
  if (S.hb && s < 2) kick(t, (s ? .4 : .65)*v);
  const n = S.mel[step];
  if (n){
    const m = S.key + n.m, dur = n.len*sd;
    if (S.lead === 'brass'){ brass(m, t, dur*.92, .085*v); if (S.double) brass(m - 12, t, dur*.92, .045*v); }
    else if (S.lead === 'lowbrass') brass(m - 12, t, dur*.95, .09*v);
    else pluck(m, t, .14*v, Math.max(.35, dur));
  }
}
function crowd(on){
  if (!A.ctx) return;
  if (on && !A.crowd){
    const c = A.ctx, s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain(), lfo = c.createOscillator(), lg = c.createGain();
    s.buffer = A.noise; s.loop = true; fl.type = 'bandpass'; fl.frequency.value = 900; fl.Q.value = .5;
    g.gain.value = .07; lfo.frequency.value = .3; lg.gain.value = .03; lfo.connect(lg); lg.connect(g.gain);
    s.connect(fl); fl.connect(g); g.connect(A.sfx); s.start(); lfo.start();
    A.crowd = { s, lfo };
  } else if (!on && A.crowd){ try { A.crowd.s.stop(); A.crowd.lfo.stop(); } catch (e) {} A.crowd = null; }
}

function soundFor(e){
  if (e.k === 'cat') return 'hiss';
  if (e.k === 'roomba') return 'beep';
  if (e.k === 'cape' || e.k === 'matador' || e.k === 'bander') return 'ole';
  if (e.k === 'picador') return 'neigh';
  if (e.k === 'wall') return 'wall';
  if (e.k === 'trash') return SLIPPY[e.kind] ? 'splat' : e.kind === 'plate' ? 'crash' : ['cushion','hat','flower'].includes(e.kind) ? 'flump' : 'thud';
  if (e.k === 'round' && e.v === 'drum') return 'boom';
  if (e.k === 'furn' && ['stove','counter','washer','booth'].includes(e.v)) return 'clang';
  if (e.k === 'furn' && e.v === 'case') return 'crash';
  if (e.k === 'mover' && e.v === 'musician') return 'honk';
  if (e.k === 'roller' && e.v === 'barrel') return 'boom';
  return 'thud';
}
function sfx(name, vol){
  if (!A.ctx || A.muted) return;
  vol = vol === undefined ? 1 : vol;
  const t = A.ctx.currentTime + .01, d = A.sfx;
  switch (name){
    case 'boop': osc('sine', 520, t, .14, .35*vol, d, { to:1150, glide:.08 }); osc('square', 1040, t, .05, .04*vol, d, { lp:3000 }); break;
    case 'thud': osc('sine', 150, t, .22, .6*vol, d, { to:45, glide:.18 }); noise(t, .08, .25*vol, d, 'lowpass', 900); break;
    case 'wall': osc('sine', 110, t, .3, .7*vol, d, { to:40, glide:.25 }); osc('triangle', 240, t, .08, .2*vol, d, { to:120 }); noise(t, .1, .3*vol, d, 'lowpass', 700); break;
    case 'hiss': noise(t, .45, .25*vol, d, 'highpass', 3200, .5); osc('sawtooth', 900, t + .05, .25, .05*vol, d, { to:350, lp:2200 }); break;
    case 'beep': osc('square', 880, t, .08, .1*vol, d, { lp:3000 }); osc('square', 660, t + .1, .14, .1*vol, d, { lp:3000 }); break;
    case 'splat': noise(t, .2, .45*vol, d, 'lowpass', 1400, 1, 250); osc('sine', 220, t, .1, .2*vol, d, { to:80 }); break;
    case 'crash': for (let i = 0; i < 5; i++) noise(t + i*.025, .28, .22*vol, d, 'highpass', 2800 + i*700, 2); osc('triangle', 2500, t, .3, .05*vol, d, { to:1900 }); break;
    case 'neigh': osc('sawtooth', 620, t, .55, .1*vol, d, { to:380, glide:.5, lp:1800 }); osc('sawtooth', 660, t + .02, .5, .07*vol, d, { to:420, glide:.45, lp:2200, detune:30 }); osc('sine', 90, t, .2, .4*vol, d, { to:50 }); break;
    case 'pop': osc('sine', 260, t, .14, .4*vol, d, { to:900, glide:.06 }); noise(t, .07, .25*vol, d, 'bandpass', 1400, 2); osc('triangle', 180, t, .1, .2*vol, d, { to:120 }); break;
    case 'flump': noise(t, .16, .3*vol, d, 'lowpass', 500); break;
    case 'boom': osc('sine', 95, t, .55, .8*vol, d, { to:38, glide:.45 }); noise(t, .1, .3*vol, d, 'lowpass', 400); break;
    case 'clang': [523, 1340, 2210].forEach(f => osc('sine', f, t, .55, .1*vol, d)); noise(t, .05, .2*vol, d, 'highpass', 4000); break;
    case 'honk': osc('sawtooth', 233, t, .4, .22*vol, d, { lp:500, lpTo:2600, to:190, glide:.4 }); break;
    case 'ole': noise(t, .9, .3*vol, d, 'bandpass', 900, .6); noise(t + .05, .8, .18*vol, d, 'bandpass', 1900, .8); osc('sine', 300, t, .3, .1*vol, d, { to:600 }); break;
    case 'slurp': for (let i = 0; i < 4; i++) osc('sine', 300 + Math.random()*200, t + i*.06, .07, .22*vol, d, { to:650 }); break;
    case 'zoom': [0,4,7,12,16].forEach((s, i) => osc('square', mtof(72 + s), t + i*.05, .1, .08*vol, d, { lp:3000 })); break;
    case 'slip': osc('sine', 950, t, .55, .2*vol, d, { to:280, glide:.5 }); break;
    case 'snort': noise(t, .18, .32*vol, d, 'bandpass', 520, 3, 260); noise(t + .21, .12, .2*vol, d, 'bandpass', 620, 3); break;
    case 'whoosh': noise(t, .5, .18*vol, d, 'bandpass', 500, 1.5, 2600); break;
    case 'rocket':
      noise(t, .9, .2*vol, d, 'bandpass', 800, 4, 4200); osc('sine', 900, t, .9, .1*vol, d, { to:2900, glide:.85 });
      osc('sine', 70, t + .95, .9, .9*vol, d, { to:30, glide:.6 }); noise(t + .95, .7, .7*vol, d, 'lowpass', 1600, 1, 200); break;
    case 'go': [0,7,12].forEach((s, i) => osc('sawtooth', mtof(67 + s), t + i*.09, .22, .12*vol, d, { lp:2600, a:.02 })); break;
    case 'fanfare':
      [0,4,7].forEach((s, i) => osc('sawtooth', mtof(65 + s), t + i*.12, .16, .14*vol, d, { lp:3000, a:.02 }));
      [0,4,7,12].forEach(s => osc('sawtooth', mtof(65 + s), t + .36, .8, .08*vol, d, { lp:2800, a:.03 })); break;
    case 'siesta':
      [67,66,65,64].forEach((m, i) => osc('sawtooth', mtof(m - 12), t + i*.38, i === 3 ? 1.1 : .34, .16*vol, d, { lp:900, a:.03, to: i === 3 ? mtof(m - 13) : 0 }));
      noise(t + 2.0, .9, .12*vol, d, 'lowpass', 380); noise(t + 3.2, .9, .12*vol, d, 'lowpass', 380); break;
    case 'cheer':
      noise(t, 2.8, .3*vol, d, 'bandpass', 1000, .5); noise(t + .1, 2.4, .18*vol, d, 'bandpass', 2200, .7);
      [0,4,7,12].forEach((s, i) => osc('sawtooth', mtof(65 + s), t + i*.13, i === 3 ? 1.1 : .18, .14*vol, d, { lp:3000, a:.02 })); break;
  }
}
function setMuted(m){
  A.muted = m;
  try { localStorage.setItem('frenchie-muted', m ? '1' : '0'); } catch (e) {}
  const b = $('snd'); b.textContent = m ? '🔇' : '🔊'; b.setAttribute('aria-label', m ? 'Turn sound on' : 'Mute sound');
  if (A.ctx) A.master.gain.setTargetAtTime(m ? 0 : .8, A.ctx.currentTime, .05);
}

/* ---------- HUD ---------- */
let lastStreet = '';
function hudUpdate(){
  const L = LEVELS[st.lv], d = Math.min(L.len, st.dist), p = d/L.len*100;
  $('prog').style.width = p + '%'; $('dogmark').style.left = p + '%';
  $('meters').textContent = Math.floor(d) + ' / ' + L.len + ' m';
  const s = `${st.lv + 1}. ${L.place}`;
  if (s !== lastStreet){ $('street').textContent = s; lastStreet = s; }
  const sb = $('stam'); sb.style.width = st.stam + '%'; sb.classList.toggle('low', st.stam < 25);
  const b = run.boops + st.boops;
  $('boops').textContent = b + (b === 1 ? ' boop' : ' boops');
}

/* ---------- story flow ---------- */
function showCard(html, buttons){
  hud.classList.remove('on'); chargeBtn.classList.remove('on'); hint.classList.remove('on');
  input.charge = false; chargeBtn.classList.remove('held');
  card.innerHTML = html + buttons.map((b, i) => `<button id="b${i}" class="${b.ghost ? 'ghost' : ''}">${b.label}</button>`).join('');
  buttons.forEach((b, i) => { $('b' + i).onclick = b.on; });
  ov.classList.add('show'); $('b0').focus();
}

function menu(){
  mode = 'menu'; reset(0);
  setMusic('menu', -1);
  const saved = load();
  const buttons = [{ label:'Start the story', on: () => { run = { lv:0, boops:0, time:0, siestas:0 }; chapter(0); } }];
  if (saved && saved.lv > 0 && saved.lv < LEVELS.length)
    buttons.push({ label:`Continue from part ${saved.lv + 1}`, ghost:true, on: () => { run = saved; chapter(saved.lv); } });
  showCard(`
    <h1>Running of the Frenchie</h1>
    <p>Pamplona, 7 July. The ranch was supposed to send six fighting bulls. Someone ticked the wrong box. What arrived in the corral was Chorizo: twelve kilos of French bulldog, a red pañuelo and strong opinions about churros. He belongs to Abuela Pilar, who would like him back. He will not be taking the direct route.</p>
    <ul class="rules">
      <li><span>👆</span>${finePointer ? 'Steer with the mouse or arrow keys.' : 'Drag anywhere to steer.'}</li>
      <li><span>🔴</span>Hold Charge to run faster. It costs breath.</li>
      <li><span>🥣</span>Water bowls refill your breath. Booping runners helps a little.</li>
      <li><span>🥖</span>Churros give you zoomies.</li>
      <li><span>🔊</span>Music and sound are on. Tap the speaker to mute.</li>
      <li><span>🚪</span>Indoors, every room has one doorway. Find it.</li>
      <li><span>😮‍💨</span>Out of breath means siesta, and you retry that part.</li>
    </ul>`, buttons);
}

function chapter(i, doneMsg){
  mode = 'card'; run.lv = i; save(run); reset(i);
  setMusic('menu', -1);
  const L = LEVELS[i];
  showCard(`
    ${doneMsg ? `<p class="done">${doneMsg}</p>` : ''}
    <p class="part">Part ${i + 1} of ${LEVELS.length}, ${L.place}</p>
    <h1>${L.name}</h1>
    <p>${L.story}</p>
    <p class="news">${L.news}</p>`, [{ label:'Run', on: () => startLevel(i) }]);
}

function startLevel(i){
  reset(i); run.lv = i; lastStreet = ''; mode = 'play';
  setMusic(styleFor(i), i); sfx(i === 0 ? 'rocket' : 'go');
  $('endmark').textContent = i === LEVELS.length - 1 ? '👵' : LEVELS[i].env === 'house' ? '🚪' : '🚩';
  ov.classList.remove('show'); hud.classList.add('on'); chargeBtn.classList.add('on');
  if (finePointer) hint.classList.add('on');
  last = performance.now();
  hudUpdate();
}

function levelDone(){
  const i = st.lv, b = st.boops, t = st.t;
  run.boops += b; run.time += t;
  sfx('fanfare');
  if (i === LEVELS.length - 1){ finale(); return; }
  chapter(i + 1, `Part ${i + 1} done in ${t.toFixed(1)} seconds with ${b} ${b === 1 ? 'boop' : 'boops'}.`);
}

function siesta(){
  mode = 'card'; run.siestas++; save(run);
  setMusic(null); sfx('siesta');
  const L = LEVELS[st.lv], d = Math.floor(st.dist), i = st.lv;
  const lines = [
    'A runner fanned him with a rolled-up newspaper.',
    'Someone from a balcony lowered a cushion on a string.',
    'Three runners sat down too, out of respect.',
    'A waiter brought water and did not charge for it.'
  ];
  showCard(`
    <h1>Siesta.</h1>
    <p>Chorizo lay down in ${L.place} at ${d} m. ${lines[run.siestas % lines.length]}</p>
    <p class="done">Siestas so far: ${run.siestas}.</p>`,
    [{ label:`Try part ${i + 1} again`, on: () => startLevel(i) },
     { label:'Read this part’s story again', ghost:true, on: () => chapter(i) }]);
}

function rank(b, s){
  if (b === 0) return 'Very good boy. Zero chaos.';
  if (s === 0 && b >= 150) return 'Legend of San Fermín. Not one nap.';
  if (b < 40) return 'Mildly feral.';
  if (b < 110) return 'Tiny menace of Pamplona.';
  if (b < 200) return 'They’ll write songs about him.';
  return 'Legend of San Fermín.';
}

function finale(){
  mode = 'card'; clearSave();
  setMusic('pena', 30); sfx('cheer');
  showCard(`
    <h1>¡Olé, Chorizo!</h1>
    <p>Chorizo reaches Abuela Pilar and sits, very politely, for the churro. He has been through eleven houses, a bakery, a hotel and a phone company. Twenty thousand people stand up. The ranch in Salamanca sends a strongly worded letter. Next July, the city writes back and asks for him by name.</p>
    <div class="stats">
      <div><b>${run.boops}</b><small>boops</small></div>
      <div><b>${run.time.toFixed(0)}</b><small>seconds</small></div>
      <div><b>${run.siestas}</b><small>siestas</small></div>
    </div>
    <p class="title">${rank(run.boops, run.siestas)}</p>`,
    [{ label:'Run the whole thing again', on: () => { run = { lv:0, boops:0, time:0, siestas:0 }; chapter(0); } }]);
}

/* ---------- input ---------- */
let steering = false;
function steerTo(clientX){
  const r = cv.getBoundingClientRect();
  st.tx = clamp((clientX - r.left - roadL)/roadW, .06, .94);
}
cv.addEventListener('pointerdown', e => { if (mode !== 'play') return; steering = true; cv.setPointerCapture(e.pointerId); steerTo(e.clientX); });
cv.addEventListener('pointermove', e => { if (mode !== 'play') return; if (steering || e.pointerType === 'mouse') steerTo(e.clientX); });
const stopSteer = () => { steering = false; };
cv.addEventListener('pointerup', stopSteer); cv.addEventListener('pointercancel', stopSteer);

const chargeOn = e => { e.preventDefault(); if (mode !== 'play') return; if (!input.charge) sfx('snort'); input.charge = true; chargeBtn.classList.add('held'); if (e.pointerId !== undefined) chargeBtn.setPointerCapture(e.pointerId); };
const chargeOff = () => { input.charge = false; chargeBtn.classList.remove('held'); };
chargeBtn.addEventListener('pointerdown', chargeOn);
chargeBtn.addEventListener('pointerup', chargeOff);
chargeBtn.addEventListener('pointercancel', chargeOff);
chargeBtn.addEventListener('lostpointercapture', chargeOff);
chargeBtn.addEventListener('contextmenu', e => e.preventDefault());

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') input.keys.left = true;
  else if (k === 'arrowright' || k === 'd') input.keys.right = true;
  else if (k === ' ' && mode === 'play'){ if (!input.charge) sfx('snort'); input.charge = true; chargeBtn.classList.add('held'); }
  else return;
  e.preventDefault();
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') input.keys.left = false;
  else if (k === 'arrowright' || k === 'd') input.keys.right = false;
  else if (k === ' ') chargeOff();
});
addEventListener('blur', () => { input.keys = {}; chargeOff(); });

/* ---------- loop ---------- */
function frame(now){
  const dt = Math.min(.05, (now - last)/1000 || 0); last = now;
  if (mode === 'play'){ update(dt); if (mode === 'play') hudUpdate(); }
  else st.t += dt;
  draw();
  requestAnimationFrame(frame);
}

addEventListener('pointerdown', audioInit, true);
addEventListener('keydown', audioInit, true);
$('snd').addEventListener('click', () => { audioInit(); setMuted(!A.muted); });
setMuted(A.muted);
addEventListener('resize', resize);
resize();
menu();
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
</body>
</html>
